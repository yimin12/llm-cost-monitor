# Portable backend stack for llm-cost-monitor:
#   - postgres        : data store (always on)
#   - migrate-desktop : one-shot Prisma migrator for the desktop schema  (profile: migrate)
#   - migrate-server  : one-shot Prisma migrator for the server schema   (profile: migrate)
#   - server          : the team-sync Core Service                       (profile: server)
#
# By default `docker compose up` brings up postgres only — the dev shape.
# `docker compose --profile server up` adds the Core Service so any
# machine can run the team-sync API portably (slice 4+7 of
# .claude/worktrees/docker-portable-app-design/design.md).
#
# Bound to 127.0.0.1 only — no LAN exposure. Password is dev-only and
# meaningless because the bind is loopback. Data lives in a named Docker
# volume `lcm_pgdata` that survives `docker compose down`; only `db:reset`
# (or `docker volume rm lcm_pgdata`) destroys it.
#
# Postgres is the only event-store backend in both dev and shipped builds.
# Rationale: docs/storage-decision.md. Docker layout: docs/docker-portable.md.

services:
  postgres:
    # Pin to a specific minor. Override with POSTGRES_IMAGE=postgres:17.x-alpine
    # for upgrades. Pinning by digest is recommended in CI/prod — see
    # docs/docker-portable.md for the workflow.
    image: ${POSTGRES_IMAGE:-postgres:17.2-alpine}
    container_name: llm-cost-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: llm_cost_monitor
      POSTGRES_USER: lcm
      POSTGRES_PASSWORD: lcm_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - lcm_pgdata:/var/lib/postgresql/data
      # Bootstrap script: ensures the team-sync database exists alongside
      # the desktop one. Runs ONLY on first volume init (idempotent on
      # re-runs because /docker-entrypoint-initdb.d is skipped if data
      # is already present). For an existing volume, the migrate-server
      # service below also creates the DB defensively.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcm -d llm_cost_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # One-shot Prisma migration runner for the desktop database.
  # Run with:  docker compose run --rm migrate-desktop
  # Idempotent — re-running re-applies any pending migrations.
  migrate-desktop:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      LCM_DATABASE_URL: postgres://lcm:lcm_dev@host.docker.internal:5433/llm_cost_monitor
    command: ["prisma", "migrate", "deploy", "--schema", "prisma/desktop/schema.prisma"]
    # Reach the postgres container via the host's exposed port. This works
    # regardless of which compose project actually owns the postgres
    # container (handy when the user has multiple worktrees or kept the
    # old `feat/auth-gmail` postgres running). If you specifically want
    # to depend on the postgres service in THIS project, swap the env
    # var host to `postgres` and add a `depends_on: { postgres: { condition: service_healthy } }`.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # One-shot Prisma migration runner for the team-sync server database.
  # Creates the database if it doesn't exist yet, then applies migrations.
  # Run with:  docker compose run --rm migrate-server
  migrate-server:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      LCM_SERVER_DATABASE_URL: postgres://lcm:lcm_dev@host.docker.internal:5433/lcm_team_sync
    # `psql -h postgres` is not available in the migrate image, so we use
    # prisma's db execute via a tiny inline init. Simpler: rely on the
    # init script in db-init/ for new volumes, and assume the DB exists
    # for established ones (operator runs CREATE DATABASE manually once).
    command: ["prisma", "migrate", "deploy", "--schema", "prisma/server/schema.prisma"]
    # Reach the postgres container via the host's exposed port. This works
    # regardless of which compose project actually owns the postgres
    # container (handy when the user has multiple worktrees or kept the
    # old `feat/auth-gmail` postgres running). If you specifically want
    # to depend on the postgres service in THIS project, swap the env
    # var host to `postgres` and add a `depends_on: { postgres: { condition: service_healthy } }`.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Team-sync Core Service. The desktop app posts redacted UsageEvents to
  # this service over HTTPS (or http://localhost in single-machine
  # deployments) — see src/main/sync/transport.ts.
  #
  # Run with:  docker compose --profile server up -d
  # Or via:    npm run server:up
  #
  # Self-migrates on boot (server/index.ts → runServerMigrations) so this
  # service does NOT depend on the migrate-server one-shot. Operators who
  # want Prisma-managed migrations can still run `npm run db:migrate:server`
  # ahead of bringing the server up; the in-process runner is idempotent.
  server:
    profiles: ["server"]
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: llm-cost-monitor-server
    restart: unless-stopped
    environment:
      LCM_SERVER_DSN: postgres://lcm:lcm_dev@postgres:5432/lcm_team_sync
      LCM_SERVER_PORT: "4017"
      # 0.0.0.0 inside the container so the published port works. The
      # host-side mapping below pins external access to loopback.
      LCM_SERVER_BIND: "0.0.0.0"
    ports:
      - "127.0.0.1:4017:4017"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4017/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    # Hardening: read-only rootfs (the server writes nothing to disk; it
    # logs to stdout and connects to Postgres over TCP). /tmp is a tmpfs
    # so any transient file work the Node runtime needs still succeeds.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

volumes:
  lcm_pgdata:
